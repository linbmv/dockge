name: Node.js CI - Dockge

on:
  push:
    branches: [master]
    paths-ignore:
      - '*.md'
  pull_request:
    branches: [master]
    paths-ignore:
      - '*.md'

permissions:
  contents: read

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Configure Git line endings
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check Typescript
        run: npm run check-ts

      - name: Test
        shell: bash
        run: |
          set +e
          npm test > test-output.log 2>&1
          status=$?
          cat test-output.log
          if [ "$status" -ne 0 ]; then
            awk '
              /^not ok [0-9]+ / { in_failure=1; block=$0; next }
              in_failure {
                block=block "\n" $0
              }
              in_failure && /^  \.\.\.$/ {
                gsub(/%/, "%25", block)
                gsub(/\r/, "%0D", block)
                gsub(/\n/, "%0A", block)
                printf "::error title=Failed test::%s\n", block
                in_failure=0
              }
            ' test-output.log
          fi
          exit "$status"

      - name: Build
        run: npm run build:frontend
